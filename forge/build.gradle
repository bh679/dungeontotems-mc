// Dungeon Totems for Forge 47 (Minecraft 1.20.1). The same jar loads on NeoForge 20.1.
//
// Jar name contract for this line: dungeontotems-forge-1.20.1-<version>.jar, released under tag
// v<version>+mc1.20.1. Dungeon Train resolves dungeontotems-neoforge-<v>.jar under v<v> only,
// so it can never pick this jar up. Never rename it to the neoforge pattern.
plugins {
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Shared vanilla code compiles into this jar.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs, never a MC resource
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'dungeontotems.advancements', 'true' // dev runs load the advancement tab before launch
        }

        // ./gradlew :forge:runSelfTest: drives every morph form in a real client (client/FormSelfTest) and quits.
        selfTest {
            client()
            gameDirectory = project.file('run-selftest')
            systemProperty 'dungeontotems.selftest', 'true'
            systemProperty 'dungeontotems.advancements', 'true'
            systemProperty 'dungeontotems.selftest.forms', System.getProperty('forms', '')
            systemProperty 'dungeontotems.selftest.advancements', System.getProperty('advancements', '')
            systemProperty 'dungeontotems.selftest.stacking', System.getProperty('stacking', '')
            systemProperty 'dungeontotems.selftest.zombie', System.getProperty('zombie', '')
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        // ./gradlew :forge:runGameTestServer: runs the GameTests and exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            systemProperty 'dungeontotems.advancements', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras: Forge 47 doesn't ship it, so it is bundled (jarJar) and bootstrapped.
    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    jarJar 'io.github.llamalad7:mixinextras-forge:0.4.1'

    // Jade, optional. Compile-only for compat/jade/ZombieJadePlugin. -PwithJade puts it in the dev runs.
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    if (project.hasProperty('withJade')) modRuntimeOnly "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// Generate mods.toml from its template.
tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        forge_version           : forge_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
legacyForge.ideSyncTask tasks.named('generateModMetadata')

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
            'MixinConfigs'           : "${mod_id}.mixins.json",
        ])
    }
}
