// Dungeon Totems: Fabric 26.3 mod (branch mc26.3). The same mod as neoforge/, from the same common/ code.
// Dungeon Train NEVER uses this line: see PORTING.md.

plugins {
    id 'net.fabricmc.fabric-loom'
}

// Jar: build/libs/dungeontotems-fabric-26.3-<version>.jar. Never anything with "neoforge" in it.
base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// common/ compiles on its own against plain Minecraft and its sources are also compiled into this jar,
// the MultiLoader-Template way, as in neoforge/.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs — never a MC resource
}

repositories {
    // Jade, through Modrinth's Maven proxy (compile-only: see compat/jade).
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        // ./gradlew :fabric:runClient [-Djoin=localhost:25599]: -Djoin joins a server straight away.
        client {
            client()
            property 'dungeontotems.advancements', 'true' // dev runs load the advancement tab before launch
            runDir 'run'
            if (System.getProperty('join')) programArgs '--quickPlayMultiplayer', System.getProperty('join')
        }
        server {
            server()
            runDir 'run-server'
        }
        // ./gradlew :fabric:runGameTestServer: every @DtGameTest on a flat world, then exits.
        gameTestServer {
            server()
            name 'GameTest Server'
            property 'fabric-api.gametest'
            property 'fabric-api.gametest.report-file', "${project.layout.buildDirectory.get()}/gametest/report.xml"
            property 'dungeontotems.advancements', 'true'
            runDir 'build/gametest'
        }
        // ./gradlew :fabric:runSelfTest [-Dforms=..|-Dzombie=true|-Dstacking=true|-Dadvancements=true|play|-Dpop=true]
        selfTest {
            client()
            name 'Self Test'
            runDir 'run-selftest'
            property 'dungeontotems.selftest', 'true'
            property 'dungeontotems.mixinaudit', System.getProperty('mixinaudit', 'false') // load every mixin target at start
            property 'dungeontotems.advancements', 'true'
            property 'dungeontotems.selftest.forms', System.getProperty('forms', '')
            property 'dungeontotems.selftest.advancements', System.getProperty('advancements', '')
            property 'dungeontotems.selftest.stacking', System.getProperty('stacking', '')
            property 'dungeontotems.selftest.pop', System.getProperty('pop', '')
            property 'dungeontotems.selftest.zombie', System.getProperty('zombie', '')
            programArgs '--quickPlaySingleplayer', 'New World'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // @Nullable and friends, which NeoForge's classpath carries and Fabric's doesn't.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Jade — optional, compile-only (its "jade" entrypoint loads compat/jade only when Jade is there).
    compileOnly "maven.modrinth:jade:${jade_fabric_version}"
    if (project.hasProperty('withJade')) runtimeOnly "maven.modrinth:jade:${jade_fabric_version}"
}

processResources {
    var replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version      : minecraft_version,
        fabric_loader_version  : fabric_loader_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('jar', Jar).configure {
    doFirst {
        // Dungeon Train resolves dungeontotems-neoforge-<v>.jar; this jar must never look like it.
        if (archiveFileName.get().contains('neoforge')) {
            throw new GradleException("Fabric jar must not be named like a NeoForge jar: ${archiveFileName.get()}")
        }
    }
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
        ])
    }
}
