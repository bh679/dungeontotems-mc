// Dungeon Totems for Fabric (Minecraft 1.20.1, Fabric Loader + Fabric API).
//
// Jar name contract for this line: dungeontotems-fabric-1.20.1-<version>.jar, released under tag
// v<version>+mc1.20.1 beside the Forge jar. Dungeon Train resolves dungeontotems-neoforge-<v>.jar under v<v>
// only, so it can never pick this jar up. Never rename it to the neoforge pattern.
plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// The shared mod (common/) compiles into this jar.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs, never a MC resource
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }

    runs {
        client {
            client()
            property 'dungeontotems.advancements', 'true' // dev runs load the advancement tab before launch
        }
        server {
            server()
            runDir 'run-server'
            property 'dungeontotems.advancements', 'true'
        }

        // ./gradlew :fabric:runGametest: runs the shared GameTests on vanilla's flat test world and exits.
        gametest {
            server()
            name 'Game Test'
            runDir 'run-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
            property 'dungeontotems.advancements', 'true'
        }

        // ./gradlew :fabric:runSelfTest: the client self-tests (client/FormSelfTest and friends), then quits.
        selfTest {
            client()
            name 'Self Test'
            runDir 'run-selftest'
            property 'dungeontotems.selftest', 'true'
            property 'dungeontotems.advancements', 'true'
            property 'dungeontotems.selftest.forms', System.getProperty('forms', '')
            property 'dungeontotems.selftest.advancements', System.getProperty('advancements', '')
            property 'dungeontotems.selftest.stacking', System.getProperty('stacking', '')
            property 'dungeontotems.selftest.zombie', System.getProperty('zombie', '')
            programArgs '--quickPlaySingleplayer', 'New World'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's names plus Parchment's parameters: the same names common/ and forge/ compile against.
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // javax.annotation.Nullable, which Forge's classpath brings and Fabric's doesn't.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Jade, optional. Compile-only for compat/jade/ZombieJadePlugin. -PwithJade puts it in the dev runs.
    modCompileOnly "maven.modrinth:jade:${jade_fabric_version}"
    if (project.hasProperty('withJade')) modLocalRuntime "maven.modrinth:jade:${jade_fabric_version}"
}

processResources {
    var replaceProperties = [
        version            : mod_version,
        mod_id             : mod_id,
        mod_name           : mod_name,
        mod_license        : mod_license,
        mod_authors        : mod_authors,
        mod_description    : mod_description,
        minecraft_version  : minecraft_version,
        fabric_loader_min  : fabric_loader_min,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

java {
    withSourcesJar()
}

// The release asset: remapJar's output, checked so it never carries the neoforge name Dungeon Train resolves.
tasks.named('remapJar').configure {
    doLast {
        def name = archiveFileName.get()
        if (name.contains('neoforge')) throw new GradleException("Fabric jar must not use the neoforge name: ${name}")
    }
}
