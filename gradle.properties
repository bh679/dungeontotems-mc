# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings: readable parameter names + javadoc.
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Minecraft / Forge (1.20.1 line). The Forge jar also loads on NeoForge 20.1.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.29
loader_version_range=[47,)

# Fabric (1.20.1 line). fabric_loader_min is what the jar asks of players.
fabric_loader_version=0.17.2
fabric_loader_min=0.15.0
fabric_api_version=0.92.6+1.20.1

# Mod. mod_version tracks the main (1.21.1) version this line was ported from.
# Release tag: v<mod_version>+mc1.20.1; jars: dungeontotems-forge-1.20.1-<mod_version>.jar and
# dungeontotems-fabric-1.20.1-<mod_version>.jar. Patch bumps here are this line's own changes.
# Dungeon Train resolves only dungeontotems-neoforge-<v>.jar under tag v<v>, so it never picks this up.
mod_id=dungeontotems
mod_name=Dungeon Totems
mod_license=PolyForm Shield 1.0.0
mod_version=0.26.1
mod_group_id=games.brennan.dungeontotems
mod_authors=Brennan Hatton
mod_description=Totems of Undying that still save you, but leave a curse behind: weakness, fatigue, heartbreak, blindness, a random animal form, or zombification. Plus a Void Totem that pulls you back from the void.

# Jade (optional, compile-only for compat/jade). Modrinth version ids of Jade 11.13.3 for 1.20.1.
jade_version=xJQHCmWJ
jade_fabric_version=ahavHbAT
