name: Release (1.20.1)

# The 1.20.1 line's release. Dispatch it on this branch:
#   gh workflow run release.yml --ref mc1.20.1 -f tag=v<mod_version>+mc1.20.1
# Same file name as main's release so GitHub lets it be dispatched; it refuses any other branch.
#
# Dungeon Train must never use this build. DT resolves releases/download/v<v>/dungeontotems-neoforge-<v>.jar,
# so this release's tag (v<v>+mc1.20.1) and jars (dungeontotems-forge-1.20.1-<v>.jar,
# dungeontotems-fabric-1.20.1-<v>.jar) can never match, and
# the GitHub release is never marked latest. Uploads are files only: no listing text or settings change.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create + release: v<mod_version>+mc1.20.1 (e.g. v0.26.0+mc1.20.1)."
        required: true
        type: string
      notify_discord:
        description: "Announce in Discord (off by default for this line)."
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      LINE_BRANCH: mc1.20.1
      MC_VERSION: 1.20.1
    steps:
      - name: Refuse to run off the 1.20.1 branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${LINE_BRANCH}" ]; then
            echo "::error::Dispatch this with --ref ${LINE_BRANCH} (got ${GITHUB_REF_NAME})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LINE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Verify the tag is v<mod_version>+mc1.20.1
        run: |
          GRADLE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          EXPECTED="v${GRADLE_VERSION}+mc${MC_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED" ]; then
            echo "::error::Tag must be ${EXPECTED} (mod_version=${GRADLE_VERSION} on ${LINE_BRANCH}); got ${RELEASE_TAG}."
            exit 1
          fi
          echo "MOD_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "JAR=dungeontotems-forge-${MC_VERSION}-${GRADLE_VERSION}.jar" >> "$GITHUB_ENV"
          echo "FABRIC_JAR=dungeontotems-fabric-${MC_VERSION}-${GRADLE_VERSION}.jar" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Compute release type
        id: release_type
        run: |
          MAJOR="${MOD_VERSION%%.*}"
          if [ "$MAJOR" -gt 0 ] 2>/dev/null; then
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "type=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: ./gradlew build --no-daemon

      - name: Stage the Forge and Fabric jars
        run: |
          mkdir -p release-artifacts
          cp "forge/build/libs/${JAR}" release-artifacts/
          cp "fabric/build/libs/${FABRIC_JAR}" release-artifacts/
          case "$(ls release-artifacts)" in *neoforge*) echo "::error::Port jars must not use the neoforge name"; exit 1;; esac
          ls -la release-artifacts/

      - name: Create GitHub Release (never latest)
        uses: softprops/action-gh-release@v2
        with:
          name: Dungeon Totems ${{ env.MOD_VERSION }} for Minecraft 1.20.1 (Forge, NeoForge, Fabric)
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.LINE_BRANCH }}
          generate_release_notes: true
          files: release-artifacts/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          make_latest: false

      - name: Check mod-platform publish prerequisites
        id: publish_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          MODRINTH_READY=false
          CURSEFORGE_READY=false
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then MODRINTH_READY=true
          else echo "::warning::Modrinth secret/variable missing, skipping Modrinth."; fi
          if [ -n "$CURSEFORGE_TOKEN" ] && [ -n "$CURSEFORGE_PROJECT_ID" ]; then CURSEFORGE_READY=true
          else echo "::warning::CurseForge secret/variable missing, skipping CurseForge."; fi
          echo "modrinth=$MODRINTH_READY" >> "$GITHUB_OUTPUT"
          echo "curseforge=$CURSEFORGE_READY" >> "$GITHUB_OUTPUT"

      # One file for Forge and NeoForge 1.20.1 (NeoForge 20.1 loads Forge 47 mods).
      - name: Publish to Modrinth + CurseForge (1.20.1, Forge + NeoForge)
        if: steps.publish_check.outputs.modrinth == 'true' || steps.publish_check.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.publish_check.outputs.modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.publish_check.outputs.curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ env.JAR }}
          name: Dungeon Totems ${{ env.MOD_VERSION }} (1.20.1 Forge)
          version: ${{ env.MOD_VERSION }}+mc1.20.1
          version-type: ${{ steps.release_type.outputs.type }}
          loaders: |
            forge
            neoforge
          game-versions: 1.20.1
          java: 17
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: warn
          dependencies: ""

      # The Fabric jar, a file of its own on the same projects. Fabric API is required.
      - name: Publish to Modrinth + CurseForge (1.20.1, Fabric)
        if: steps.publish_check.outputs.modrinth == 'true' || steps.publish_check.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.publish_check.outputs.modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.publish_check.outputs.curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ env.FABRIC_JAR }}
          name: Dungeon Totems ${{ env.MOD_VERSION }} (1.20.1 Fabric)
          version: ${{ env.MOD_VERSION }}+mc1.20.1-fabric
          version-type: ${{ steps.release_type.outputs.type }}
          loaders: fabric
          game-versions: 1.20.1
          java: 17
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: warn
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

      - name: Notify Discord
        if: ${{ inputs.notify_discord && env.RELEASE_TAG != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "::warning::DISCORD_WEBHOOK_URL not set"; exit 0; fi
          TAG_URL=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['RELEASE_TAG']))")
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"**Dungeon Totems ${MOD_VERSION} for Minecraft 1.20.1** released! https://github.com/${REPO}/releases/tag/${TAG_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"
