name: Release (26.3)

# The 26.3 line's release. Dispatch it on this branch:
#   gh workflow run release.yml --ref mc26.3 -f tag=v<mod_version>+mc26.3
# Same file name as main's release so GitHub lets it be dispatched; it refuses any other branch.
#
# One tag carries both 26.3 jars: dungeontotems-neoforge-26.3-<v>.jar and dungeontotems-fabric-26.3-<v>.jar,
# each uploaded to CurseForge and Modrinth tagged with its own loader.
#
# Dungeon Train must never use this build. DT resolves releases/download/v<v>/dungeontotems-neoforge-<v>.jar,
# so this release's tag (v<v>+mc26.3) and jars can never match, and the GitHub release is never marked
# latest. Uploads are files only: no listing text or settings change.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create + release: v<mod_version>+mc26.3 (e.g. v0.26.0+mc26.3)."
        required: true
        type: string
      notify_discord:
        description: "Announce in Discord (off by default for this line)."
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      LINE_BRANCH: mc26.3
      MC_VERSION: "26.3"
    steps:
      - name: Refuse to run off the 26.3 branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${LINE_BRANCH}" ]; then
            echo "::error::Dispatch this with --ref ${LINE_BRANCH} (got ${GITHUB_REF_NAME})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LINE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v3

      - name: Verify the tag is v<mod_version>+mc26.3
        run: |
          GRADLE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          GRADLE_MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          if [ "$GRADLE_MC" != "$MC_VERSION" ]; then
            echo "::error::minecraft_version=${GRADLE_MC} on ${LINE_BRANCH}, expected ${MC_VERSION}."
            exit 1
          fi
          EXPECTED="v${GRADLE_VERSION}+mc${MC_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED" ]; then
            echo "::error::Tag must be ${EXPECTED} (mod_version=${GRADLE_VERSION} on ${LINE_BRANCH}); got ${RELEASE_TAG}."
            exit 1
          fi
          echo "MOD_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "JAR=dungeontotems-neoforge-${MC_VERSION}-${GRADLE_VERSION}.jar" >> "$GITHUB_ENV"
          echo "FABRIC_JAR=dungeontotems-fabric-${MC_VERSION}-${GRADLE_VERSION}.jar" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Compute release type
        id: release_type
        run: |
          MAJOR="${MOD_VERSION%%.*}"
          if [ "$MAJOR" -gt 0 ] 2>/dev/null; then
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "type=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: ./gradlew build --no-daemon

      - name: Stage the 26.3 jars
        run: |
          mkdir -p release-artifacts
          cp "neoforge/build/libs/${JAR}" release-artifacts/
          cp "fabric/build/libs/${FABRIC_JAR}" release-artifacts/
          case "$FABRIC_JAR" in *neoforge*) echo "::error::Fabric jar must not say neoforge"; exit 1;; esac
          # Dungeon Train resolves exactly dungeontotems-neoforge-<version>.jar: this line must never ship that name.
          if [ -e "release-artifacts/dungeontotems-neoforge-${MOD_VERSION}.jar" ]; then
            echo "::error::Port jar must not use Dungeon Train's jar name"; exit 1
          fi
          ls -la release-artifacts/

      - name: Create GitHub Release (never latest)
        uses: softprops/action-gh-release@v2
        with:
          name: Dungeon Totems ${{ env.MOD_VERSION }} for Minecraft 26.3 (NeoForge + Fabric)
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.LINE_BRANCH }}
          generate_release_notes: true
          files: release-artifacts/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          make_latest: false

      - name: Check mod-platform publish prerequisites
        id: publish_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          MODRINTH_READY=false
          CURSEFORGE_READY=false
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then MODRINTH_READY=true
          else echo "::warning::Modrinth secret/variable missing, skipping Modrinth."; fi
          if [ -n "$CURSEFORGE_TOKEN" ] && [ -n "$CURSEFORGE_PROJECT_ID" ]; then CURSEFORGE_READY=true
          else echo "::warning::CurseForge secret/variable missing, skipping CurseForge."; fi
          echo "modrinth=$MODRINTH_READY" >> "$GITHUB_OUTPUT"
          echo "curseforge=$CURSEFORGE_READY" >> "$GITHUB_OUTPUT"

      # A file on the same projects as main (CurseForge 1800270, Modrinth dungeontotems), tagged 26.3 + NeoForge.
      - name: Publish to Modrinth + CurseForge (26.3, NeoForge)
        if: steps.publish_check.outputs.modrinth == 'true' || steps.publish_check.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.publish_check.outputs.modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.publish_check.outputs.curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ env.JAR }}
          name: Dungeon Totems ${{ env.MOD_VERSION }} (26.3 NeoForge)
          version: ${{ env.MOD_VERSION }}+mc26.3
          version-type: ${{ steps.release_type.outputs.type }}
          loaders: neoforge
          game-versions: "26.3"
          java: 25
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: warn
          dependencies: ""

      # The Fabric jar: same projects, tagged 26.3 + Fabric, needing Fabric API.
      - name: Publish to Modrinth + CurseForge (26.3, Fabric)
        if: steps.publish_check.outputs.modrinth == 'true' || steps.publish_check.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.publish_check.outputs.modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.publish_check.outputs.curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/${{ env.FABRIC_JAR }}
          name: Dungeon Totems ${{ env.MOD_VERSION }} (26.3 Fabric)
          version: ${{ env.MOD_VERSION }}+mc26.3-fabric
          version-type: ${{ steps.release_type.outputs.type }}
          loaders: fabric
          game-versions: "26.3"
          java: 25
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: warn
          dependencies: |
            fabric-api(required)

      - name: Notify Discord
        if: ${{ inputs.notify_discord && env.RELEASE_TAG != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "::warning::DISCORD_WEBHOOK_URL not set"; exit 0; fi
          TAG_URL=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['RELEASE_TAG']))")
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"**Dungeon Totems ${MOD_VERSION} for Minecraft 26.3** released! https://github.com/${REPO}/releases/tag/${TAG_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"
