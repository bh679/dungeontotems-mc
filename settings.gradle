pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Dungeon Totems, Minecraft 26.3 line (MultiLoader layout, like the 1.20.1 line).
// common/ is vanilla-only code; neoforge/ is the NeoForge 26.3 mod. A fabric/ project joins later.
// Dungeon Train never uses this line.
rootProject.name = 'dungeontotems'
include 'common'
include 'neoforge'
