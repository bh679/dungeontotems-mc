pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Dungeon Totems, Minecraft 1.20.1 line (MultiLoader layout).
// common/ is vanilla-only code; forge/ is the Forge 47 mod (its jar also runs on NeoForge 20.1).
// A fabric/ project joins later. Dungeon Train never uses this line.
rootProject.name = 'dungeontotems'
include 'common'
include 'forge'
