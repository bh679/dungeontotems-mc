// Dungeon Totems, Minecraft 26.3 line. See PORTING.md.
plugins {
    id 'net.neoforged.moddev' version '2.0.149' apply false
}

subprojects {
    apply plugin: 'java-library'
    version = mod_version
    group = mod_group_id
    // Minecraft 26.x ships Java 25 to end users.
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    repositories {
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xmaxerrs' << '3000'
    }
}
