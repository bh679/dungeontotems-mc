// Dungeon Totems: NeoForge 26.3 gameplay mod (branch mc26.3; main stays NeoForge 1.21.1).
//
// Totems of Undying that save you like the vanilla one but leave a curse behind, plus narrow totems.
// Dungeon Train NEVER uses this line: see PORTING.md.

plugins {
    id 'idea'
    id 'net.neoforged.moddev'
}

// Jar: build/libs/dungeontotems-neoforge-26.3-<version>.jar. Never the bare
// dungeontotems-neoforge-<version>.jar, which is the name Dungeon Train resolves (main's 1.21.1 jar).
base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// common/ compiles on its own against plain Minecraft (proving it is vanilla-only) and its sources are
// also compiled into this jar, the MultiLoader-Template way.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
sourceSets.test.java.srcDir project(':common').file('src/test/java')

sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs — never a MC resource
}

repositories {
    // Jade, through Modrinth's Maven proxy (compile-only: see compat/jade).
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    // 26.x ships unobfuscated names, so no Parchment.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'dungeontotems.advancements', 'true' // dev runs load the advancement tab before launch
        }

        // ./gradlew runSelfTest: drives every morph form in a real client (client/FormSelfTest) and quits.
        selfTest {
            client()
            gameDirectory = project.file('run-selftest')
            systemProperty 'dungeontotems.selftest', 'true'
            systemProperty 'dungeontotems.advancements', 'true'
            systemProperty 'dungeontotems.selftest.forms', System.getProperty('forms', '')
            systemProperty 'dungeontotems.selftest.advancements', System.getProperty('advancements', '')
            systemProperty 'dungeontotems.selftest.stacking', System.getProperty('stacking', '')
            systemProperty 'dungeontotems.selftest.zombie', System.getProperty('zombie', '') // add -PwithJade to see Jade's panel
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        // ./gradlew runGameTestServer: runs gametest/DungeonTotemsGameTests and exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'dungeontotems.advancements', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

dependencies {
    // Jade — optional. Compile-only for compat/jade/ZombieJadePlugin, which Jade finds by its @WailaPlugin
    // annotation, so no Jade class loads without Jade. -PwithJade puts it in the dev runs to test.
    // Jade 26.3.5 for NeoForge 26.3.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (project.hasProperty('withJade')) runtimeOnly "maven.modrinth:jade:${jade_version}"

    // Unit tests — JUnit 5 Jupiter (pure-logic only; no live ModList).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Generate neoforge.mods.toml from its template.
tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
        ])
    }
}
